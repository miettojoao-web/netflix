<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 1. Título da aba alterado -->
  <title>Meus Sites Favoritos</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <!-- 2. Título da página alterado -->
  <h1>Explore meus sites favoritos</h1>

  <!-- 4. Parágrafo com a descrição adicionado -->
  <p class="descricao">Notícias, vídeos, pesquisas e tecnologia em um só lugar.</p>

  <div class="menu">
    <!-- Botão central para abrir e fechar o menu. -->
    <button
      id="alternar"
      type="button"
      aria-label="Abrir menu"
      aria-expanded="false"
      aria-controls="opcoes"
    >
      <span aria-hidden="true">+</span>
    </button>
    <!-- As opções ficam bloqueadas enquanto o menu está fechado. -->
    <nav id="opcoes" aria-label="Menu principal" inert>
      <a
        href="https://www.uol.com.br/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="UOL"
        title="Abrir UOL"
        style="--x: -105px; --y: 0px; --cor: #ff0077;"
      >
        <span aria-hidden="true">⌂</span>
      </a>
      <a
        href="https://www.terra.com.br/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Terra"
        title="Abrir Terra"
        style="--x: -74px; --y: -74px; --cor: #eaff00;"
      >
        <span aria-hidden="true">🌎</span>
      </a>
      <a
        href="https://www.youtube.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="YouTube"
        title="Abrir YouTube"
        style="--x: 0px; --y: -105px; --cor: #00ff55;"
      >
        <span aria-hidden="true">▶</span>
      </a>
      <a
        href="https://www.google.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Google"
        title="Abrir Google"
        style="--x: 74px; --y: -74px; --cor: #ff00ff;"
      >
        <span aria-hidden="true">🔎</span>
      </a>
      <!-- 3. Link do Instagram substituído pelo da Netflix -->
      <a
        href="https://www.netflix.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Netflix"
        title="Abrir Netflix"
        style="--x: 105px; --y: 0px; --cor: #00ccff;"
      >
        <span aria-hidden="true">🎬</span>
      </a>
      <a
        href="https://www.globo.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Globo"
        title="Abrir Globo"
        style="--x: 74px; --y: 74px; --cor: #ffaa00;"
      >
        <span aria-hidden="true">📰</span>
      </a>
      <a
        href="https://www.github.com/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub"
        title="Abrir GitHub"
        style="--x: 0px; --y: 105px; --cor: #9933ff;"
      >
        <span aria-hidden="true">💻</span>
      </a>
      <a
        href="https://www.wikipedia.org/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Wikipédia"
        title="Abrir Wikipédia"
        style="--x: -74px; --y: 74px; --cor: #00ffbb;"
      >
        <span aria-hidden="true">📚</span>
      </a>
    </nav>
  </div>
  <p id="mensagem" aria-live="polite">
    Clique em + para abrir o menu.
  </p>

  <!-- 5. Rodapé adicionado -->
  <footer>
    <p>Desenvolvido por [Seu Nome] - Turma [Sua Turma]</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
